name: Build check (manual)
# statichost.eu is the deployer now: it builds and publishes this repo on every
# push, driven by statichost.yml. This workflow is no longer tied to a push, and
# it no longer deploys anywhere -- Firebase Hosting was retired (the project was
# deleted). What is left is a manual, reproducible build gate: run it from the
# Actions tab when you want a second opinion on whether the site still builds
# from a clean checkout (it also exercises the pixyll submodule clone).
#
# History, so nobody re-learns it the hard way: this was `on: [push]` deploying
# to Firebase, and its Build step had been failing silently because it asked for
# `hugo-version: latest` after Hugo removed .Site.Author from the theme's feed.
on: workflow_dispatch

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Hugo setup
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned to the version statichost.yml builds with: a floating tag is
          # exactly what silently broke this pipeline before.
          hugo-version: '0.165.0'
          extended: true

      - name: Build
        run: hugo --environment production --minify
